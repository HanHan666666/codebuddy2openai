[project]
name = "workbuddy2openai"
version = "2.0.0"
description = "Local OpenAI-compatible proxy for the CodeBuddy / WorkBuddy desktop client"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Leonid Dalin" }]
keywords = [
    "codebuddy",
    "workbuddy",
    "openai",
    "proxy",
    "adapter",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: Proxy Servers",
]
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
workbuddy2openai = "converter:main"

[project.urls]
Repository = "https://github.com/leonid-dalin/codebuddy2openai"
Upstream = "https://github.com/HanHan666666/codebuddy2openai"
Issues = "https://github.com/leonid-dalin/codebuddy2openai/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["converter.py", "desensitize.py"]
sources = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
